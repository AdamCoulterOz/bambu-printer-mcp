# BUILD/TEST ONLY: do not run until outbound isolation and project ownership are enforced.
services:
  orca:
    network_mode: none
    build:
      context: .
    init: true
    # Coordinate a shared primary group before changing the default 0600 socket mode.
    stop_grace_period: 30s
    environment:
      ORCA_GATEWAY_HOST: ${ORCA_GATEWAY_HOST:?Set the exact Host the proxy forwards}
      ORCA_GATEWAY_TOKEN_FILE: /run/secrets/orca-token
    volumes:
      - type: bind
        source: ${ORCA_ARTIFACT_DIR:?Set persistent artifact directory owned by UID 10001}
        target: /artifacts
      - type: bind
        source: ${ORCA_SOCKET_DIR:?Set private socket directory accessible to the proxy}
        target: /run/orca-gateway
      - type: bind
        source: ${ORCA_STATE_DIR:?Set private state directory owned by UID 10001}
        target: /home/orca
      - type: bind
        source: ${ORCA_TOKEN_FILE:?Set private token file owned by UID 10001}
        target: /run/secrets/orca-token
        read_only: true
