name: Build pinned Orca development artifact

on:
  push:
    branches:
      - codex/orca-upstream-20261124
    paths:
      - .github/workflows/orca-dev-build.yml
      - deploy/orca/build-ci.sh
      - deploy/orca/build-source.Dockerfile

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Check out this branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build and export pinned Orca
        run: bash deploy/orca/build-ci.sh
      - name: Upload bounded runtime bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: orca-dev-linux-amd64-${{ github.sha }}
          path: orca-artifact/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
