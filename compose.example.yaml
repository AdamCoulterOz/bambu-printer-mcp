# Supply the host paths and allowed upstream Host in your deployment environment.
# Run one instance only, with private directories owned by container UID 1000.
services:
  bambu-mcp:
    build: .
    init: true
    restart: unless-stopped
    stop_grace_period: 15s
    env_file:
      - path: ${BAMBU_CONFIG_FILE:?Set BAMBU_CONFIG_FILE to a private server configuration file}
        required: true
    environment:
      MCP_TRANSPORT: streamable-http
      MCP_HTTP_HOST: 0.0.0.0
      MCP_HTTP_PORT: "3000"
      MCP_HTTP_ALLOWED_HOSTS: ${BAMBU_UPSTREAM_HOST:?Set BAMBU_UPSTREAM_HOST to the exact Host forwarded by the proxy}
      MCP_HTTP_BEARER_TOKEN_FILE: /run/bambu-secrets/http-token
      HOME: /home/node
      XDG_CONFIG_HOME: /home/node/.config
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - type: bind
        source: ${BAMBU_STATE_DIR:?Set BAMBU_STATE_DIR to the private persistent state directory}
        target: /home/node
      - type: bind
        source: ${BAMBU_SECRETS_DIR:?Set BAMBU_SECRETS_DIR to the private secrets directory}
        target: /run/bambu-secrets
        read_only: true
    # Optional shared workspace file store (requires coordinated data-only mounts,
    # verified shared supplementary GID, and private service-owned state first):
    # group_add: ["${ARTIFACT_GROUP_GID}"]
    # environment: BAMBU_ARTIFACT_DIR=/srv/bambu-artifacts,
    #   BAMBU_ARTIFACT_OUTBOX_DIR=/srv/bambu-outbox,
    #   BAMBU_ARTIFACT_GROUP_GID=${ARTIFACT_GROUP_GID}
    # Mount the Node-owned store RW at /srv/bambu-artifacts and the Orca-owned
    # outbox RO at /srv/bambu-outbox; never share private home or credentials.
